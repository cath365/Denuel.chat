services:
  mongo:
    image: mongodb/mongodb-community-server:${MONGO_VERSION}
    container_name: denuel-mongo
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGO_DB_NAME: ${MONGO_DB_NAME}
    volumes:
      - mongo_data:/data/db
      - ./deploy/mongo/init-app-user.js:/docker-entrypoint-initdb.d/init-app-user.js:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'echo ''db.adminCommand({ ping: 1 }).ok'' | mongosh mongodb://$$MONGO_INITDB_ROOT_USERNAME:$$MONGO_INITDB_ROOT_PASSWORD@localhost:27017/admin --quiet',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - internal

  mongo-init-replica:
    image: mongodb/mongodb-community-server:${MONGO_VERSION}
    container_name: denuel-mongo-init
    restart: 'no'
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - ./deploy/scripts/init-replica.sh:/scripts/init-replica.sh:ro
    entrypoint: ['/bin/bash', '/scripts/init-replica.sh']
    networks:
      - internal

  rocketchat:
    image: registry.rocket.chat/rocketchat/rocket.chat:${ROCKETCHAT_VERSION}
    container_name: denuel-rocketchat
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init-replica:
        condition: service_completed_successfully
    environment:
      PORT: ${PORT}
      ROOT_URL: ${ROOT_URL}
      DEPLOY_METHOD: docker
      INITIAL_USER: ${INITIAL_USER}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASS: ${ADMIN_PASS}
      MONGO_URL: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_DB_NAME}?authSource=admin&replicaSet=rs0
      MONGO_OPLOG_URL: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongo:27017/local?authSource=admin&replicaSet=rs0
      OVERWRITE_SETTING_Site_Name: ${BRAND_NAME}
      OVERWRITE_SETTING_Site_Url: ${ROOT_URL}
      SETTINGS_BLOCKED: Site_Name,Site_Url
    ports:
      - '${PORT}:3000'
    volumes:
      - rocketchat_uploads:/app/uploads
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    container_name: denuel-nginx
    restart: unless-stopped
    depends_on:
      - rocketchat
    profiles:
      - edge
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    networks:
      - internal

volumes:
  mongo_data:
  rocketchat_uploads:

networks:
  internal:
    driver: bridge
