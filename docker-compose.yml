services:
  mongo:
    image: mongodb/mongodb-community-server:${MONGO_VERSION}
    container_name: denuel-mongo
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        ['CMD-SHELL', 'echo ''db.adminCommand({ ping: 1 }).ok'' | mongosh mongodb://localhost:27017/admin --quiet']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - internal

  mongo-init-replica:
    image: mongodb/mongodb-community-server:${MONGO_VERSION}
    container_name: denuel-mongo-init
    restart: 'no'
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./deploy/scripts/init-replica.sh:/scripts/init-replica.sh:ro
    entrypoint: ['/bin/bash', '/scripts/init-replica.sh']
    networks:
      - internal

  rocketchat:
    image: registry.rocket.chat/rocketchat/rocket.chat:${ROCKETCHAT_VERSION}
    container_name: denuel-rocketchat
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init-replica:
        condition: service_completed_successfully
    environment:
      PORT: ${PORT}
      ROOT_URL: ${ROOT_URL}
      DEPLOY_METHOD: docker
      INITIAL_USER: ${INITIAL_USER}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASS: ${ADMIN_PASS}
      MONGO_URL: ${MONGO_URL}?replicaSet=rs0
      MONGO_OPLOG_URL: ${MONGO_OPLOG_URL}?replicaSet=rs0
      OVERWRITE_SETTING_Site_Name: ${BRAND_NAME}
      OVERWRITE_SETTING_Site_Url: ${ROOT_URL}
      SETTINGS_BLOCKED: Site_Name,Site_Url
    ports:
      - '127.0.0.1:${PORT}:3000'
    volumes:
      - rocketchat_uploads:/app/uploads
    networks:
      - internal

volumes:
  mongo_data:
  rocketchat_uploads:

networks:
  internal:
    driver: bridge
